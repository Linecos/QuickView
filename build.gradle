plugins {
    id 'fabric-loom' version "${loom_version}"
}

// dev 分支构建自动追加 -dev 后缀（产物如 quickview-1.0.0-dev.jar）
// 其它分支 / tag / 加上 -Prelease 时产出正式版本号（如 quickview-1.0.0.jar）
def quickviewGitBranch = {
    try {
        return providers.exec {
            commandLine 'git', 'rev-parse', '--abbrev-ref', 'HEAD'
        }.standardOutput.asText.get().trim()
    } catch (Exception ignored) {
        return ''
    }
}()
def quickviewDevBuild = (quickviewGitBranch == 'dev') && !project.hasProperty('release')

version = project.mod_version + (quickviewDevBuild ? '-dev' : '')
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'AliyunPublic'
        url = 'https://maven.aliyun.com/repository/public'
    }
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'AlexIIL'
        url = 'https://staging.alexiil.uk/maven/'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "io.github.cottonmc:LibGui:${project.libgui_version}"

    // 拼音搜索（houbb/pinyin，Apache-2.0，Maven Central）。
    // 做的是「词级分词 + 多音字」转换，实测 重庆→chongqing、长沙→changsha、银行→yinhang、音乐→yinyue，
    // 声母 重庆→cq、音乐→yy —— 这些是 Tinypinyin 单读音做不到的（见 PROJECT_MEMORY §4.4）。
    // 三个 jar 必须一起捆绑：pinyin 依赖 heaven；nlp-common 提供分词用的 trie/dfa，
    // 去掉它会在 PinyinSegments 初始化时 NoClassDefFoundError（已实测）。
    implementation "com.github.houbb:pinyin:${project.pinyin_version}"
    include "com.github.houbb:pinyin:${project.pinyin_version}"
    include "com.github.houbb:heaven:${project.pinyin_heaven_version}"
    include "com.github.houbb:nlp-common:${project.pinyin_nlp_common_version}"
}

processResources {
    // ⚠️ configuration-cache：闭包在 CC 重放时不能再依赖隐式任务属性（如 `inputs`），否则执行期报
    // MissingPropertyException: inputs。把版本号捕获成局部变量（String 可序列化）再传给闭包。
    def modVersion = project.version
    inputs.property "version", modVersion

    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
