plugins {
    id 'fabric-loom' version "${loom_version}"
}

// dev 分支构建自动追加 -dev 后缀（产物如 quickview-1.0.0-dev.jar）
// 其它分支 / tag / 加上 -Prelease 时产出正式版本号（如 quickview-1.0.0.jar）
def quickviewGitBranch = {
    try {
        return providers.exec {
            commandLine 'git', 'rev-parse', '--abbrev-ref', 'HEAD'
        }.standardOutput.asText.get().trim()
    } catch (Exception ignored) {
        return ''
    }
}()
def quickviewDevBuild = (quickviewGitBranch == 'dev') && !project.hasProperty('release')

version = project.mod_version + (quickviewDevBuild ? '-dev' : '')
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'AliyunPublic'
        url = 'https://maven.aliyun.com/repository/public'
    }
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'AlexIIL'
        url = 'https://staging.alexiil.uk/maven/'
    }
    maven {
        name = 'Bbkr'
        url = 'https://server.bbkr.space:8081/artifactory/libs-release/'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "io.github.cottonmc:LibGui:${project.libgui_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
