name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # 仓库里 gradlew 的权限位是 100644（Windows 下提交的），
      # Linux runner 上必须补上可执行位，否则 ./gradlew 会 Permission denied。
      - name: 赋予 gradlew 可执行权限
        run: chmod +x ./gradlew

      - name: 构建
        run: ./gradlew build --console=plain --no-daemon

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: quickview-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: quickview-jar
          path: jars

      - name: 创建 Release 并附加 jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" jars/*.jar \
            --repo "${GITHUB_REPOSITORY}" \
            --title "QuickView ${GITHUB_REF_NAME}" \
            --generate-notes
